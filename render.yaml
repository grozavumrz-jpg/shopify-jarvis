services:
  - type: web
    name: shopify-jarvis
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      # Persistent database (REQUIRED for real use). Without it Jarvis uses SQLite,
      # which Render free deletes on every restart/deploy (opt-outs, logs, settings).
      - key: DATABASE_URL
        sync: false
      # Password for opening the dashboard outside Shopify admin (header X-Jarvis-Key).
      - key: JARVIS_ADMIN_KEY
        sync: false
      - key: SHOP_DOMAIN
        value: maisongrozavu.myshopify.com
      # Optional: Admin API token of a custom app; re-registers the shop after restarts.
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: Grozavu <contact@maisongrozavu.com>
      - key: REPLY_TO_EMAIL
        value: info@maisongrozavu.com
      - key: MERCHANT_NOTIFY_EMAIL
        value: grozavumrz@gmail.com
      - key: BRAND_NAME
        value: Grozavu
      - key: FEED_DOMAIN
        value: maisongrozavu.com
